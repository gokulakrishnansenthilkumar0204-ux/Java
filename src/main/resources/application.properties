# ===================================================================
# Student Issue Management and Prioritization System
# Database Configuration for Supabase PostgreSQL
# ===================================================================

spring.application.name=student-issue-management

# -------------------------------------------------------------------
# Load the .env file from the project root automatically.
# No more PowerShell / bash commands are needed before starting the app.
# Real OS / IDE environment variables still take priority over .env.
# "optional:" means the app also starts when no .env file exists
# (e.g. on a server where the variables are set by the platform).
# -------------------------------------------------------------------
spring.config.import=optional:file:.env[.properties]

# Supabase Datasource configuration (values come from .env or environment variables)
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Supabase connection pooler (port 6543, transaction mode) does not support
# server-side prepared statements. prepareThreshold=0 disables them so you do
# not get "prepared statement S_1 already exists" errors. Harmless on port 5432.
spring.datasource.hikari.data-source-properties.prepareThreshold=0
# Supabase free tier allows few connections - keep the pool small
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000

# -------------------------------------------------------------------
# Create the tables and the issue_summary view automatically on startup
# (CREATE TABLE IF NOT EXISTS - existing data is never deleted).
# continue-on-error keeps the app starting if your existing view differs slightly.
# -------------------------------------------------------------------
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema-postgres.sql
spring.sql.init.continue-on-error=true

# Schema is managed by db/schema-postgres.sql, so Hibernate does not touch it
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Thymeleaf View Engine Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Server Configuration
server.port=8080
